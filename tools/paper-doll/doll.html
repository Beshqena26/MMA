<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#223}</style></head>
<body>
<canvas id="c" width="900" height="1000"></canvas>
<script src="rig.js"></script>
<script>
// Paper-doll rig. Each part: img, pivot (px on the part = its joint),
// parent + anchor (px on the PARENT part where this pivot attaches),
// rot (degrees), scale, z. World root = hips.

const cv=document.getElementById('c'), cx=cv.getContext('2d');
const imgs={}; let left=Object.keys(RIG).length;
for(const k in RIG){
  const im=new Image(); im.onload=()=>{if(--left===0)draw()};
  im.src=RIG[k].src; imgs[k]=im;
}

function worldTransform(name){
  const p=RIG[name];
  let m = p.parent ? worldTransform(p.parent) : new DOMMatrix().translate(p.anchor[0],p.anchor[1]);
  if(p.parent){
    m = m.multiply(new DOMMatrix()
        .translate(p.anchor[0]*SCALE*0,0));           // anchor applied below in parent's local px
  }
  return m;
}

// simpler: compute recursively with explicit math
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='#223'; cx.fillRect(0,0,cv.width,cv.height);
  const order=Object.keys(RIG).sort((a,b)=>RIG[a].z-RIG[b].z);
  const world={};
  function mat(name){
    if(world[name])return world[name];
    const p=RIG[name];
    let m;
    if(!p.parent){
      m=new DOMMatrix().translate(p.anchor[0],p.anchor[1]).scale(SCALE)
        .rotate(p.rot).translate(-p.pivot[0],-p.pivot[1]);
    }else{
      const pm=mat(p.parent);
      m=pm.multiply(new DOMMatrix().translate(p.anchor[0],p.anchor[1])
        .rotate(p.rot).translate(-p.pivot[0],-p.pivot[1]));
    }
    world[name]=m; return m;
  }
  for(const k of order){
    const m=mat(k);
    cx.setTransform(m);
    cx.drawImage(imgs[k],0,0);
  }
  cx.setTransform(1,0,0,1,0,0);
  // joint markers for tuning
  if(location.search.includes('debug')){
    for(const k of order){
      const m=mat(k), pt=m.transformPoint(new DOMPoint(RIG[k].pivot[0],RIG[k].pivot[1]));
      cx.fillStyle='#0f0';cx.beginPath();cx.arc(pt.x,pt.y,4,0,7);cx.fill();
      cx.fillStyle='#fff';cx.font='10px monospace';cx.fillText(k,pt.x+6,pt.y);
    }
  }
  document.title='DOLL READY';
}
window.RIG=RIG; window.redraw=draw;
// ── POSE LIBRARY: each pose = joint-angle overrides (+optional per-part dx,dy on root) ──
const BASE=BASEPOSE;
window.POSES=POSES;
function applyPose(name){
  const p=POSES[name]||{};
  for(const k in RIG) RIG[k].rot = (k in p)? p[k] : BASE[k];
}
const q=new URLSearchParams(location.search);
if(q.get('pose')){ applyPose(q.get('pose')); }
if(q.has('sheet')){
  // contact sheet: render every pose side by side
  const names=Object.keys(POSES);
  cv.width=460*names.length; cv.height=1000;
  const origDraw=draw;
  window.drawSheet=function(){
    cx.setTransform(1,0,0,1,0,0);
    cx.fillStyle='#223';cx.fillRect(0,0,cv.width,cv.height);
    names.forEach((nm,i)=>{
      applyPose(nm);
      const world={};
      const order=Object.keys(RIG).sort((a,b)=>RIG[a].z-RIG[b].z);
      function mat(name){
        if(world[name])return world[name];
        const p=RIG[name];let m;
        if(!p.parent){m=new DOMMatrix().translate(p.anchor[0]-450+230+460*i,p.anchor[1]).scale(SCALE)
          .rotate(p.rot).translate(-p.pivot[0],-p.pivot[1]);}
        else{const pm=mat(p.parent);
          m=pm.multiply(new DOMMatrix().translate(p.anchor[0],p.anchor[1])
            .rotate(p.rot).translate(-p.pivot[0],-p.pivot[1]));}
        world[name]=m;return m;
      }
      for(const k of order){cx.setTransform(mat(k));cx.drawImage(imgs[k],0,0);}
      cx.setTransform(1,0,0,1,0,0);
      cx.fillStyle='#8f8';cx.font='bold 22px monospace';
      cx.fillText(nm.toUpperCase(),460*i+40,60);
    });
    document.title='DOLL READY';
  };
  // re-route the loader callback
  let n=Object.keys(RIG).length; // images may already be loading; hook after
  const t=setInterval(()=>{ if(Object.values(imgs).every(im=>im.complete)){clearInterval(t);drawSheet();} },100);
}

</script>
</body></html>
